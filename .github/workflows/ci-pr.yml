name: Vérifier les pull requests

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript, contenu et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Préparer Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: lts/*
          cache: npm

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Vérifier le typage, les données pédagogiques, le build et les bundles
        run: npm run check
